name: Stitch vers Discord

on:
  schedule:
    - cron: '*/15 * * * *'      # toutes les 15 minutes (minimum GitHub : 5 minutes)
  workflow_dispatch:
    inputs:
      mode:
        description: "inspect = affiche les outils et réponses (rien n'est posté) ; run = poste les nouveaux écrans"
        default: inspect

permissions:
  contents: read

concurrency:
  group: stitch-to-discord
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    environment: DEV
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Mémorise les écrans déjà annoncés entre deux exécutions
      - name: Restaurer l'état
        uses: actions/cache@v4
        with:
          path: .state
          key: stitch-seen-${{ github.run_id }}
          restore-keys: stitch-seen-

      - name: Vérifier les nouveaux écrans
        run: node scripts/stitch-to-discord.mjs
        env:
          MODE: ${{ github.event.inputs.mode || 'run' }}
          STITCH_API_KEY: ${{ secrets.STITCH_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          STITCH_PROJECT_ID: ${{ vars.STITCH_PROJECT_ID }}
          STITCH_PROJECT_URL: ${{ vars.STITCH_PROJECT_URL }}
          STITCH_LIST_ARGS_JSON: ${{ vars.STITCH_LIST_ARGS_JSON }}
